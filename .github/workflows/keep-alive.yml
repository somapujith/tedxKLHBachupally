# Keeps the Render API awake from OUTSIDE the service.
#
# Render's free plan spins an instance down after ~15 minutes of no inbound
# traffic, and the next visitor pays a 30-60s cold start on the register page.
#
# server/keepAlive.js pings from inside the running service, but a process that
# has already been spun down runs no timers and cannot ping anything — it can
# only keep a live instance live. This workflow is the half that can also WAKE a
# sleeping one, because the request originates elsewhere. Run both.
#
# SETUP (one-time): add a repository variable named KEEP_ALIVE_URL set to the
# Render service origin, e.g. https://tedx-api.onrender.com
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
# Without it the job exits successfully with a notice rather than failing every
# ten minutes.
#
# NOTE ON CRON: GitHub's scheduled runners are best-effort and are frequently
# delayed under load, sometimes past 15 minutes. Treat this as a strong reducer
# of cold starts, not a guarantee of zero. The in-process pinger covers the gaps
# whenever the service is already up.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: # allow a manual wake before an event

# A backed-up queue of pings has no value — only the newest matters.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${KEEP_ALIVE_URL}" ]; then
            echo "::notice::KEEP_ALIVE_URL repository variable is not set — skipping."
            exit 0
          fi

          target="${KEEP_ALIVE_URL%/}/api/health"
          echo "Pinging ${target}"

          # --max-time 90 because a genuinely cold Render container can take
          # 30-60s to answer, and that slow answer is a SUCCESS: it means this
          # ping did the job of waking it.
          # --retry covers the transient 502 Render returns mid-boot.
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "${target}")

          echo "HTTP ${status}"
          cat /tmp/health.json || true
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Health check returned HTTP ${status}"
            exit 1
          fi
